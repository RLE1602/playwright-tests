name: LSIG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Set folder variables
      - name: Prepare preview folders
        shell: bash
        run: |
          # Timestamp for optional archiving
          TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
          ARCHIVE_DIR="previews/main/$TIMESTAMP"
          LATEST_DIR="previews/main/latest"

          # Create folders
          mkdir -p "$ARCHIVE_DIR"
          mkdir -p "$LATEST_DIR"

          # Export paths as environment variables for next steps
          echo "ARCHIVE_DIR=$ARCHIVE_DIR" >> $GITHUB_ENV
          echo "LATEST_DIR=$LATEST_DIR" >> $GITHUB_ENV

      # 5. Run Playwright tests into archive folder
      - name: Run Playwright tests
        shell: bash
        run: |
          npx playwright test --output=$ARCHIVE_DIR || true

      # 6. Copy artifacts to "latest" folder for RGOS
      - name: Copy artifacts to latest folder
        shell: bash
        run: |
          rm -rf "$LATEST_DIR/*"
          cp -r "$ARCHIVE_DIR/"* "$LATEST_DIR/"

      # 7. Run RGOS visual regression
      - name: Run RGOS visual comparison
        shell: bash
        run: |
          # Assuming RGOS CLI or script uses:
          # - baselineFolder
          # - currentFolder
          # - diffFolder
          npx rgos --baseline previews/main/baseline \
                   --current "$LATEST_DIR" \
                   --diff "$LATEST_DIR/diff"

      # 8. Upload artifacts (archive + latest + diffs)
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: playwright-visual-artifacts
          path: |
            previews/main/latest
            previews/main/$TIMESTAMP
