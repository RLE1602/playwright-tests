name: Playwright Visual Regression

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Prepare preview folders
      - name: Prepare folders
        shell: bash
        run: |
          # Timestamp for archive
          TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
          ARCHIVE_DIR="previews/main/$TIMESTAMP"
          LATEST_DIR="previews/main/latest"

          # Create folders
          mkdir -p "$ARCHIVE_DIR"
          mkdir -p "$LATEST_DIR"

          # Export for next steps
          echo "ARCHIVE_DIR=$ARCHIVE_DIR" >> $GITHUB_ENV
          echo "LATEST_DIR=$LATEST_DIR" >> $GITHUB_ENV

      # 5. Run Playwright tests into archive folder
      - name: Run Playwright tests
        shell: bash
        run: |
          npx playwright test --output=$ARCHIVE_DIR || true

      # 6. Copy artifacts to latest folder for RGOS
      - name: Copy artifacts to latest folder
        shell: bash
        run: |
          rm -rf "$LATEST_DIR/*"
          cp -r "$ARCHIVE_DIR/"* "$LATEST_DIR/"

      # 7. Run RGOS visual regression
      - name: Run RGOS visual comparison
        shell: bash
        run: |
          # Example RGOS CLI command
          npx rgos --baseline previews/main/baseline \
                   --current "$LATEST_DIR" \
                   --diff "$LATEST_DIR/diff"

      # 8. Upload artifacts using supported v4
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          # Unique name for each run
          name: visual-artifacts-${{ github.run_number }}
          path: |
            previews/main/latest
            previews/main/$TIMESTAMP
